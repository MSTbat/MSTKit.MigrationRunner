name: Publish NuGet Package

on:
  push:
    branches:
      - main

permissions:
  id-token: write   
  contents: read
  packages: write    

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x  

      - name: Restore dependencies
        run: dotnet restore MSTKit.MigrationRunner/MSTKit.MigrationRunner.csproj

      - name: Build
        run: dotnet build MSTKit.MigrationRunner/MSTKit.MigrationRunner.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack MSTKit.MigrationRunner/MSTKit.MigrationRunner.csproj --configuration Release --no-build -o out

      # Login to NuGet via OIDC
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Publish to NuGet.org (via Trusted Publishing)
      - name: Publish to NuGet.org
        run: dotnet nuget push "out/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Publish to GitHub Packages
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "out/*.nupkg" \
            --api-key $GITHUB_TOKEN \
            --source "https://nuget.pkg.github.com/MSTbat/index.json" \
            --skip-duplicate